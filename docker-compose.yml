version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-triage
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Africa/Lagos
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      # Read from .env, which is not committed. Used by the Slack alert node.
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # n8n blocks $env in expressions by default. The Slack alert node needs it to read
      # SLACK_WEBHOOK_URL, which keeps the secret out of the workflow file.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows
    # Add this section
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    network_mode: bridge
      
volumes:
  n8n_data:
